\n  @keyframes lr-dictate { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }\n  @keyframes lr-curtain { from { clip-path: inset(0 0 100% 0) } to { clip-path: inset(0 0 0 0) } }\n  @keyframes lr-drift { 0%,100% { transform: scale(1.02) translate(0,0) } 50% { transform: scale(1.07) translate(-.8%,-.8%) } }\n  @keyframes lr-lamp { 0%,100% { filter: brightness(.86) } 50% { filter: brightness(1.1) } }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"position:relative;overflow-x:hidden;background:#14110F\">\n\n  <div style=\"position:fixed;inset:0;z-index:80;pointer-events:none;opacity:.055;mix-blend-mode:multiply;background-image:url('data:image/svg+xml;utf8,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22&gt;&lt;filter id=%22n%22&gt;&lt;feTurbulence type=%22fractalNoise%22 sc-camel-base-frequency=%220.8%22 sc-camel-num-octaves=%223%22 sc-camel-stitch-tiles=%22stitch%22/&gt;&lt;/filter&gt;&lt;rect width=%22160%22 height=%22160%22 filter=%22url(%23n)%22/&gt;&lt;/svg&gt;');background-size:160px 160px\"><\u002Fdiv>\n\n  <!-- ══ HEADER ══ -->\n  <header style=\"position:sticky;top:0;z-index:70;background:rgba(20,17,15,.93);backdrop-filter:blur(6px);border-bottom:1px solid rgba(241,231,211,.18)\">\n    <div style=\"max-width:1440px;margin:0 auto;padding:10px clamp(16px,3vw,40px);display:flex;align-items:center;gap:clamp(12px,2.4vw,34px)\">\n      <a href=\"#top\" style=\"border:0;flex:0 0 auto;width:clamp(50px,4.6vw,70px);mix-blend-mode:screen\"><img src=\"ea317150-a57c-42e7-b85e-5be6d12f47b2\" alt=\"Lost Room\" style=\"width:100%;display:block\"><\u002Fa>\n      <nav style=\"display:flex;gap:clamp(12px,1.8vw,28px);flex-wrap:wrap;font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.18em;color:rgba(241,231,211,.82)\">\n        <a href=\"#format\" style=\"border:0;color:inherit\" style-hover=\"color:#A97E3C\">FORMAT<\u002Fa>\n        <a href=\"#eventi\" style=\"border:0;color:inherit\" style-hover=\"color:#A97E3C\">EVENTI<\u002Fa>\n        <a href=\"#team-building\" style=\"border:0;color:inherit\" style-hover=\"color:#A97E3C\">TEAM BUILDING<\u002Fa>\n        <a href=\"#chi-siamo\" style=\"border:0;color:inherit\" style-hover=\"color:#A97E3C\">CHI SIAMO<\u002Fa>\n      <\u002Fnav>\n      <div style=\"margin-left:auto;display:flex;align-items:center;gap:clamp(10px,1.6vw,22px)\">\n        <a href=\"#chi-siamo\" style=\"border:0;font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.16em;color:rgba(241,231,211,.55)\" style-hover=\"color:#A97E3C\">CHI SIAMO<\u002Fa>\n        <a href=\"#contatti\" style=\"border:1px solid #F1E7D3;color:#F1E7D3;padding:11px 18px;font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.2em;min-height:44px;display:inline-flex;align-items:center\" style-hover=\"background:#7B1D14;border-color:#7B1D14\">CONTATTI<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ══ HERO ══ -->\n  <section id=\"top\" data-screen-label=\"Hero\" style=\"position:relative;height:min(calc(94vh - 78px),940px);min-height:460px;background:#241E1A\">\n    <div style=\"position:absolute;inset:0;animation:lr-curtain 1200ms cubic-bezier(.2,.7,.2,1) both\">\n      <image-slot id=\"lr-h2-hero\" shape=\"rect\" fit=\"cover\" placeholder=\"Foto d'apertura — giocatori al buio, luce sui volti\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <div style=\"position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(20,17,15,.74) 0%,rgba(20,17,15,.14) 38%,rgba(20,17,15,.92) 100%)\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(22px,4vw,60px) clamp(20px,5vw,72px) clamp(26px,4.5vw,68px);max-width:1440px;margin:0 auto\">\n      <div style=\"animation:lr-dictate 900ms ease-out both;align-self:flex-start;position:relative;border:1px solid rgba(169,126,60,.75);padding:5px;background:rgba(20,17,15,.42)\">\n        <div style=\"border:3px double rgba(169,126,60,.6);padding:11px clamp(16px,2.4vw,30px);display:flex;align-items:center;gap:clamp(10px,1.6vw,20px)\">\n          <span style=\"font-family:'Bodoni Moda',serif;font-size:13px;color:#A97E3C\">✳<\u002Fspan>\n          <span style=\"font-family:'IM Fell English SC',serif;font-size:clamp(11px,1.1vw,14px);letter-spacing:.26em;color:#A97E3C\">LOST ROOM - REAL LIFE GAME CAGLIARI, SARDEGNA · DAL 2016<\u002Fspan>\n          <span style=\"font-family:'Bodoni Moda',serif;font-size:13px;color:#A97E3C\">✳<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:clamp(20px,4vw,60px);flex-wrap:wrap\">\n        <h1 style=\"flex:1 1 520px;margin:0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(32px,5.2vw,76px);line-height:.99;letter-spacing:-.015em;animation:lr-dictate 1000ms 250ms ease-out both;text-shadow:0 2px 30px rgba(20,17,15,.5)\">Da più di dieci anni vi portiamo a giocare <em style=\"font-style:italic;color:#A97E3C\">dove non ve lo aspettate.<\u002Fem><\u002Fh1>\n        <div style=\"flex:0 0 auto;width:clamp(60px,6.5vw,98px);opacity:.72;animation:lr-dictate 1000ms 600ms ease-out both\"><img src=\"3e581367-76c8-4f3a-aa75-a3a5a26d924b\" alt=\"\" style=\"width:100%;display:block;filter:invert(1);animation:lr-lamp 8s ease-in-out infinite\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══ HERO — RACCONTO ══ -->\n  <section data-screen-label=\"Racconto hero\" style=\"position:relative;padding:clamp(40px,6vw,96px) clamp(20px,5vw,72px)\">\n    <div style=\"max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(28px,5vw,80px);align-items:start\">\n      <div style=\"min-width:0\">\n        <p data-reveal=\"\" style=\"margin:0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(21px,2.2vw,30px);line-height:1.45;color:#F1E7D3;max-width:30ch\">Siamo nati a Cagliari nel 2016 chiudendo persone consenzienti dentro le prime escape room piene di enigmi.<\u002Fp>\n        <div data-reveal=\"\" style=\"margin-top:26px;display:flex;gap:14px;align-items:flex-start\">\n          <span style=\"flex:0 0 auto;width:34px;margin-top:6px\"><img src=\"182a9ac5-4999-4cdd-ab9e-688d2151f0c2\" alt=\"\" style=\"width:100%;display:block;filter:invert(1);opacity:.6\"><\u002Fspan>\n          <p style=\"margin:0;font-size:clamp(18px,1.5vw,21px);line-height:1.6;color:rgba(241,231,211,.78);max-width:34ch\">Poi, a un certo punto, le stanze hanno cominciato a starci strette.<br><br>Così abbiamo portato i nostri giochi fuori.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"min-width:0\">\n        <p data-reveal=\"\" style=\"margin:0;font-size:clamp(19px,1.7vw,24px);line-height:1.6;color:#F1E7D3;max-width:44ch\">Oggi inventiamo giochi, storie ed esperienze immersive per persone, aziende, enti e territori.<br>A Cagliari, in Sardegna, in Italia. E ovunque tu abbia il coraggio.<\u002Fp>\n        <div data-reveal=\"\" style=\"display:flex;gap:16px;flex-wrap:wrap;margin-top:clamp(24px,3vw,38px)\">\n          <a href=\"#format\" style=\"border:0;background:#7B1D14;color:#F1E7D3;padding:17px 30px;font-family:'IM Fell English SC',serif;font-size:15px;letter-spacing:.2em;box-shadow:5px 5px 0 #A97E3C;min-height:48px;display:inline-flex;align-items:center\" style-hover=\"transform:translate(2px,2px);box-shadow:3px 3px 0 #A97E3C\">SCOPRI COSA FACCIAMO<\u002Fa>\n          <a href=\"#progetti\" style=\"border:1px solid #F1E7D3;color:#F1E7D3;padding:17px 30px;font-family:'IM Fell English SC',serif;font-size:15px;letter-spacing:.2em;min-height:48px;display:inline-flex;align-items:center\" style-hover=\"background:#F1E7D3;color:#14110F\">GUARDA I NOSTRI PROGETTI<\u002Fa>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"margin-top:clamp(28px,4vw,48px);border-top:1px solid rgba(241,231,211,.25);padding-top:20px\">\n          <p style=\"margin:0;font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(20px,2vw,26px);line-height:1.45;color:#A97E3C;max-width:40ch\">In questi 10 anni sono successe un sacco di cose. Ma noi siamo sempre le stesse brutte persone.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══ DA UNA STANZA A TUTTO IL RESTO ══ -->\n  <section data-screen-label=\"Da una stanza\" style=\"background:#F1E7D3;color:#14110F;background-image:repeating-linear-gradient(0deg,rgba(20,17,15,.05) 0 1px,transparent 1px 4px)\">\n    <div data-reveal=\"\" style=\"position:relative;height:min(62vh,620px);min-height:300px;background:#241E1A\">\n      <image-slot id=\"lr-h2-stanza\" shape=\"rect\" fit=\"cover\" placeholder=\"Foto grande — dal chiuso all'aperto: una porta, una strada, una torcia\"><\u002Fimage-slot>\n      <div style=\"position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(20,17,15,.45),rgba(20,17,15,.05) 45%,rgba(241,231,211,.1))\"><\u002Fdiv>\n      <div style=\"position:absolute;left:clamp(20px,5vw,72px);top:clamp(20px,4vw,48px);font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.24em;color:#F1E7D3\">DA UNA STANZA A TUTTO IL RESTO<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1440px;margin:0 auto;padding:clamp(36px,5vw,80px) clamp(20px,5vw,72px)\">\n      <h2 data-reveal=\"\" style=\"margin:0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(28px,4.2vw,58px);line-height:1.04;max-width:26ch\">Pensavamo di costruire stanze.<br><em style=\"font-style:italic;color:#7B1D14\">In realtà stavamo imparando a costruire esperienze.<\u002Fem><\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(24px,4vw,64px);margin-top:clamp(28px,3.5vw,52px);align-items:start\">\n        <div data-reveal=\"\" style=\"min-width:0\">\n          <p style=\"margin:0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:#3A3128\">Le nostre prime storie avevano quattro pareti, una porta chiusa e sessanta minuti per trovare il modo di uscire.<\u002Fp>\n          <p style=\"margin:16px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:#3A3128\">Poi abbiamo cominciato a chiederci cosa sarebbe successo togliendo le pareti.<\u002Fp>\n          <p style=\"margin:16px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:#3A3128\">Sono arrivate le Adventure Night, le Cene con Delitto, le Mystery Dinner, i team building, gli eventi speciali, le esperienze nei luoghi culturali e nei festival, i progetti con enti e territori.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"min-width:0\">\n          <p style=\"margin:0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:#3A3128\">Abbiamo giocato dentro ville, musei, siti archeologici, parchi, ristoranti, aziende, scuole, università, giardini, per strada, in spiaggia, in campagna e in luoghi in cui probabilmente nessuno aveva mai osato organizzare (o neanche mai pensato) un gioco prima di noi.<\u002Fp>\n          <p style=\"margin:16px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:#3A3128\">Con poche persone e con centinaia di persone contemporaneamente.<\u002Fp>\n          <p style=\"margin:16px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:#3A3128\">Negli anni sono cambiati i numeri, la tecnologia e anche le cose che sappiamo fare.<\u002Fp>\n          <p style=\"margin:20px 0 0;font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(19px,1.8vw,25px);line-height:1.5;color:#7B1D14\">Non è mai cambiato il motivo per cui le facciamo: essere noi i primi a divertirci con voi.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- numeri -->\n      <div data-reveal=\"\" style=\"margin-top:clamp(32px,4vw,64px);border-top:2px solid #14110F;border-bottom:1px solid rgba(20,17,15,.3);padding:clamp(20px,2.6vw,34px) 0;display:flex;gap:clamp(20px,3vw,48px);flex-wrap:wrap\">\n        <div style=\"flex:1 1 150px\"><div style=\"font-family:'Bodoni Moda',serif;font-size:clamp(30px,3.4vw,48px);line-height:1\">2016<\u002Fdiv><div style=\"font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.18em;color:#7B6A50;margin-top:6px\">LA PRIMA PORTA CHIUSA<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1 1 150px\"><div style=\"font-family:'Bodoni Moda',serif;font-size:clamp(30px,3.4vw,48px);line-height:1\">+20.000<\u002Fdiv><div style=\"font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.18em;color:#7B6A50;margin-top:6px\">PERSONE HANNO GIOCATO CON NOI<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1 1 150px\"><div style=\"font-family:'Bodoni Moda',serif;font-size:clamp(30px,3.4vw,48px);line-height:1\">+200<\u002Fdiv><div style=\"font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.18em;color:#7B6A50;margin-top:6px\">EVENTI ORGANIZZATI<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1 1 150px\"><div style=\"font-family:'Bodoni Moda',serif;font-size:clamp(30px,3.4vw,48px);line-height:1\">4<\u002Fdiv><div style=\"font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.18em;color:#7B6A50;margin-top:6px\">ESCAPE ROOM CREATE (2016–2020)<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1 1 150px\"><div style=\"font-family:'Bodoni Moda',serif;font-size:clamp(30px,3.4vw,48px);line-height:1\">3<\u002Fdiv><div style=\"font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.18em;color:#7B6A50;margin-top:6px\">FORMAT PROPRIETARI<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1 1 150px\"><div style=\"font-family:'Bodoni Moda',serif;font-size:clamp(30px,3.4vw,48px);line-height:1\">+50<\u002Fdiv><div style=\"font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.18em;color:#7B6A50;margin-top:6px\">AZIENDE LAVORANO CON NOI<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══ FORMAT ══ -->\n  <section id=\"format\" data-screen-label=\"Format\" style=\"padding:clamp(44px,6.5vw,104px) clamp(20px,5vw,72px)\">\n    <div style=\"max-width:1440px;margin:0 auto\">\n      <div data-reveal=\"\" style=\"display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;border-bottom:2px solid rgba(241,231,211,.55);padding-bottom:14px\">\n        <h2 style=\"margin:0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(30px,4.4vw,62px);line-height:1\">I format Lost Room<\u002Fh2>\n        <span style=\"margin-left:auto;font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.2em;color:#A97E3C\">TRE FORMAT PROPRIETARI<\u002Fspan>\n      <\u002Fdiv>\n      <p data-reveal=\"\" style=\"margin:22px 0 0;font-size:clamp(19px,1.6vw,23px);line-height:1.6;color:rgba(241,231,211,.8);max-width:60ch\">Alcune cose le abbiamo fatte così tante volte che ormai hanno un nome, delle regole e una loro piccola mitologia.<\u002Fp>\n\n      <!-- Adventure Night -->\n      <div data-reveal=\"\" style=\"margin-top:clamp(32px,4vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(22px,3.5vw,56px);align-items:center\">\n        <div style=\"position:relative;aspect-ratio:4/3;min-height:220px;background:#241E1A;min-width:0\">\n          <div style=\"position:absolute;inset:0;overflow:hidden\"><div style=\"position:absolute;inset:0;animation:lr-drift 22s ease-in-out infinite\"><image-slot id=\"lr-h2-adv\" shape=\"rect\" fit=\"cover\" placeholder=\"Foto — Adventure Night, squadra in esplorazione\"><\u002Fimage-slot><\u002Fdiv><\u002Fdiv>\n          <div style=\"position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 45%,transparent 32%,rgba(20,17,15,.66) 100%)\"><\u002Fdiv>\n          <div style=\"position:absolute;left:0;bottom:0;background:#14110F;color:#F1E7D3;padding:9px 15px;font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.2em\">FORMAT N. 01<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"min-width:0\">\n          <h3 style=\"margin:0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(28px,3.4vw,46px);line-height:1.02\">Adventure Night<\u002Fh3>\n          <p style=\"margin:16px 0 0;font-family:'Bodoni Moda',serif;font-size:clamp(19px,1.6vw,23px);line-height:1.5;color:#F1E7D3\">Un luogo vero.<br>Una storia che potrebbe essere successa.<br>Squadre in esplorazione e un mistero che, naturalmente, nessuno vi aveva chiesto di risolvere.<\u002Fp>\n          <p style=\"margin:16px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.6;color:rgba(241,231,211,.75);max-width:46ch\">Le nostre Adventure Night portano il gioco fuori dalle stanze e dentro luoghi storici, culturali, naturali e urbani.<br>Il resto dovrete scoprirlo voi.<\u002Fp>\n          <a href=\"#format\" style=\"border:0;display:inline-flex;align-items:center;gap:12px;margin-top:22px;font-family:'IM Fell English SC',serif;font-size:14px;letter-spacing:.2em;color:#A97E3C;border-bottom:1px solid rgba(169,126,60,.45);padding-bottom:5px;min-height:44px\" style-hover=\"color:#F1E7D3;border-bottom-color:#F1E7D3\">SCOPRI LE ADVENTURE NIGHT<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Cena con Delitto -->\n      <div data-reveal=\"\" style=\"margin-top:clamp(30px,4vw,60px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(22px,3.5vw,56px);align-items:center\">\n        <div style=\"min-width:0;order:2\">\n          <div style=\"position:relative;background:#E4D6BC;padding:14px;min-height:240px\">\n            <div style=\"position:absolute;inset:0;border:1px solid rgba(20,17,15,.3)\"><\u002Fdiv>\n            <div style=\"position:relative;aspect-ratio:5/4;min-height:200px;overflow:hidden\"><div style=\"position:absolute;inset:0;animation:lr-drift 26s 3s ease-in-out infinite\"><image-slot id=\"lr-h2-cena\" shape=\"rect\" fit=\"cover\" placeholder=\"Foto — tavola apparecchiata, personaggi in costume\"><\u002Fimage-slot><\u002Fdiv><\u002Fdiv>\n            <div style=\"position:absolute;left:14px;bottom:-1px;background:#7B1D14;color:#F1E7D3;padding:7px 13px;font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.2em\">UNO DI VOI MENTE<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"min-width:0;order:1\">\n          <div style=\"font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.22em;color:#A97E3C\">FORMAT N. 02<\u002Fdiv>\n          <h3 style=\"margin:12px 0 0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(28px,3.4vw,46px);line-height:1.02\">Cena con Delitto<\u002Fh3>\n          <p style=\"margin:16px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.6;color:rgba(241,231,211,.78);max-width:48ch\">Dimenticate il pubblico seduto a tavola mentre qualcuno recita un omicidio davanti a voi.<br>Qui i personaggi siete voi.<\u002Fp>\n          <p style=\"margin:14px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.6;color:rgba(241,231,211,.78);max-width:48ch\">Avrete un'identità, una storia, informazioni che forse sarebbe meglio non condividere e obiettivi personali che potrebbero rendere improvvisamente molto negoziabile il concetto di amicizia.<\u002Fp>\n          <p style=\"margin:14px 0 0;font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(20px,1.9vw,25px);color:#A97E3C\">Buona cena.<\u002Fp>\n          <a href=\"#format\" style=\"border:0;display:inline-flex;align-items:center;margin-top:22px;font-family:'IM Fell English SC',serif;font-size:14px;letter-spacing:.2em;color:#A97E3C;border-bottom:1px solid rgba(169,126,60,.45);padding-bottom:5px;min-height:44px\" style-hover=\"color:#F1E7D3;border-bottom-color:#F1E7D3\">ENTRA NELLA STORIA<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Mystery Dinner -->\n      <div data-reveal=\"\" style=\"margin-top:clamp(30px,4vw,60px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(22px,3.5vw,56px);align-items:center\">\n        <div style=\"position:relative;aspect-ratio:4/3;min-height:220px;background:#241E1A;min-width:0\">\n          <div style=\"position:absolute;inset:0;overflow:hidden\"><div style=\"position:absolute;inset:0;animation:lr-drift 24s 6s ease-in-out infinite\"><image-slot id=\"lr-h2-mystery\" shape=\"rect\" fit=\"cover\" placeholder=\"Foto — squadre investigative, prove sul tavolo\"><\u002Fimage-slot><\u002Fdiv><\u002Fdiv>\n          <div style=\"position:absolute;inset:0;pointer-events:none;border:14px solid #14110F\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"min-width:0\">\n          <div style=\"font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.22em;color:#A97E3C\">FORMAT N. 03<\u002Fdiv>\n          <h3 style=\"margin:12px 0 0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(28px,3.4vw,46px);line-height:1.02\">Mystery Dinner<\u002Fh3>\n          <p style=\"margin:16px 0 0;font-family:'Bodoni Moda',serif;font-size:clamp(19px,1.6vw,23px);line-height:1.5;color:#F1E7D3\">Una cena.<br>Un caso da risolvere.<\u002Fp>\n          <p style=\"margin:14px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.6;color:rgba(241,231,211,.75);max-width:48ch\">Squadre investigative, prove, sospetti e una quantità statisticamente significativa di persone convinte di aver capito tutto dopo dodici minuti.<\u002Fp>\n          <p style=\"margin:14px 0 0;font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(19px,1.8vw,24px);color:#A97E3C\">Spoiler: generalmente no.<\u002Fp>\n          <a href=\"#format\" style=\"border:0;display:inline-flex;align-items:center;margin-top:22px;font-family:'IM Fell English SC',serif;font-size:14px;letter-spacing:.2em;color:#A97E3C;border-bottom:1px solid rgba(169,126,60,.45);padding-bottom:5px;min-height:44px\" style-hover=\"color:#F1E7D3;border-bottom-color:#F1E7D3\">INIZIA A INDAGARE<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══ DA DOVE VUOI COMINCIARE ══ -->\n  <section data-screen-label=\"Da dove cominciare\" style=\"background:#F1E7D3;color:#14110F;padding:clamp(44px,6.5vw,104px) clamp(20px,5vw,72px);background-image:repeating-linear-gradient(0deg,rgba(20,17,15,.05) 0 1px,transparent 1px 4px)\">\n    <div style=\"max-width:1440px;margin:0 auto\">\n      <div data-reveal=\"\" style=\"display:flex;gap:clamp(20px,4vw,60px);flex-wrap:wrap;align-items:flex-end;border-bottom:2px solid #14110F;padding-bottom:14px\">\n        <h2 style=\"margin:0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(28px,4.2vw,58px);line-height:1;flex:1 1 320px\">Da dove vuoi cominciare?<\u002Fh2>\n        <p style=\"margin:0;flex:1 1 260px;font-size:clamp(18px,1.5vw,21px);line-height:1.55;color:#3A3128;max-width:38ch\">Potresti essere qui per motivi molto diversi.<br>Va bene. Succede spesso.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:clamp(20px,2.6vw,40px);margin-top:clamp(28px,3.5vw,52px);align-items:start\">\n        <div data-reveal=\"\" style=\"min-width:0;border-top:1px solid rgba(20,17,15,.3);padding-top:20px\">\n          <span style=\"display:inline-block;width:40px;margin-bottom:12px\"><img src=\"182a9ac5-4999-4cdd-ab9e-688d2151f0c2\" alt=\"\" style=\"width:100%;display:block;mix-blend-mode:multiply\"><\u002Fspan>\n          <h3 style=\"margin:0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(24px,2.6vw,34px);line-height:1.1\">Voglio giocare.<\u002Fh3>\n          <p style=\"margin:12px 0 0;font-size:18px;line-height:1.6;color:#3A3128\">Cerchi una delle nostre esperienze, vuoi scoprire le prossime date o hai semplicemente una certa predisposizione a ficcarti nei guai.<br>Possiamo lavorarci.<\u002Fp>\n          <a href=\"#eventi\" style=\"border:0;display:inline-flex;align-items:center;margin-top:18px;background:#7B1D14;color:#F1E7D3;padding:15px 24px;font-family:'IM Fell English SC',serif;font-size:14px;letter-spacing:.18em;box-shadow:5px 5px 0 #14110F;min-height:48px\" style-hover=\"transform:translate(2px,2px);box-shadow:3px 3px 0 #14110F\">PORTATEMI NEI GUAI<\u002Fa>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"min-width:0;border-top:1px solid rgba(20,17,15,.3);padding-top:20px;margin-top:clamp(0px,2.5vw,40px)\">\n          <span style=\"display:inline-block;width:34px;margin-bottom:12px\"><img src=\"def385b7-beb7-4b2f-ba62-9776ec602fc8\" alt=\"\" style=\"width:100%;display:block;mix-blend-mode:multiply\"><\u002Fspan>\n          <h3 style=\"margin:0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(24px,2.6vw,34px);line-height:1.1\">Devo organizzare qualcosa.<\u002Fh3>\n          <p style=\"margin:12px 0 0;font-size:18px;line-height:1.6;color:#3A3128\">Un addio al nubilato. Una festa. Un compleanno. Un team building. Un gruppo di persone che non vuoi semplicemente mettere sedute intorno a un tavolo.<br>Ottimo.<\u002Fp>\n          <a href=\"#addii\" style=\"border:1px solid #14110F;color:#14110F;display:inline-flex;align-items:center;margin-top:18px;padding:15px 24px;font-family:'IM Fell English SC',serif;font-size:14px;letter-spacing:.18em;min-height:48px\" style-hover=\"background:#14110F;color:#F1E7D3\">VEDIAMO COSA POSSIAMO FARE<\u002Fa>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"min-width:0;border-top:1px solid rgba(20,17,15,.3);padding-top:20px;margin-top:clamp(0px,5vw,80px)\">\n          <span style=\"display:inline-block;width:44px;margin-bottom:12px\"><img src=\"3e581367-76c8-4f3a-aa75-a3a5a26d924b\" alt=\"\" style=\"width:100%;display:block;mix-blend-mode:multiply\"><\u002Fspan>\n          <h3 style=\"margin:0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(24px,2.6vw,34px);line-height:1.1\">Ho un'idea. O forse un problema.<\u002Fh3>\n          <p style=\"margin:12px 0 0;font-size:18px;line-height:1.6;color:#3A3128\">Un luogo da raccontare. Un pubblico da coinvolgere. Un territorio da far scoprire. Un evento che non vuoi assomigli a tutti gli altri.<br>Anche le frasi che iniziano con “E se facessimo…” sono benvenute.<\u002Fp>\n          <a href=\"#contatti\" style=\"border:1px solid #14110F;color:#14110F;display:inline-flex;align-items:center;margin-top:18px;padding:15px 24px;font-family:'IM Fell English SC',serif;font-size:14px;letter-spacing:.18em;min-height:48px\" style-hover=\"background:#14110F;color:#F1E7D3\">COSTRUIAMO QUALCOSA<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══ IL NOSTRO MODO ══ -->\n  <section data-screen-label=\"Il nostro modo\" style=\"padding:clamp(44px,6.5vw,104px) clamp(20px,5vw,72px);position:relative;overflow:hidden\">\n    <div style=\"position:absolute;right:-12%;top:8%;width:min(42vw,520px);opacity:.08;mix-blend-mode:screen\"><img src=\"873d04ea-91ae-4d25-ad02-8d75cc49f103\" alt=\"\" style=\"width:100%;display:block\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1440px;margin:0 auto\">\n      <div data-reveal=\"\">\n        <div style=\"font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.24em;color:#A97E3C\">IL NOSTRO MODO DI FARE LE COSE<\u002Fdiv>\n        <h2 style=\"margin:16px 0 0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(30px,4.6vw,66px);line-height:1;max-width:24ch\">Artigiani dell'ignoto e dell'inaspettato.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(24px,4vw,72px);margin-top:clamp(26px,3.5vw,52px);align-items:start\">\n        <div data-reveal=\"\" style=\"min-width:0\">\n          <p style=\"margin:0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:rgba(241,231,211,.8)\">Non ci siamo mai sentiti propriamente dei game designer.<br>Ci piace di più pensare che facciamo uno strano lavoro artigianale.<\u002Fp>\n          <p style=\"margin:16px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:rgba(241,231,211,.8)\">Prendiamo storie, luoghi, persone, enigmi, oggetti, tecnologia, teatro, psicologia, sociologia, logica e immaginazione e proviamo a capire cosa può succedere mettendo tutto insieme.<\u002Fp>\n          <p style=\"margin:24px 0 0;font-family:'Bodoni Moda',serif;font-size:clamp(20px,2vw,28px);line-height:1.4;color:#F1E7D3\">Per noi il gioco è qualcosa di magico che succede tra le persone.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"min-width:0;border-left:1px solid rgba(241,231,211,.25);padding-left:clamp(18px,2.5vw,34px)\">\n          <p style=\"margin:0;font-size:clamp(18px,1.5vw,21px);line-height:1.75;color:rgba(241,231,211,.85)\">Qualcuno prende il comando.<br>Qualcuno osserva in silenzio e trova la soluzione.<br>Qualcuno sospetta della persona sbagliata per tutta la sera.<br>Qualcuno tradisce i propri amici per vincere.<br>Qualcuno scopre di essere molto più competitivo di quanto avesse sempre raccontato.<\u002Fp>\n          <p style=\"margin:16px 0 0;font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(19px,1.8vw,24px);color:#A97E3C\">È tutto perfettamente normale.<\u002Fp>\n          <p style=\"margin:16px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:rgba(241,231,211,.8)\">Il nostro lavoro è costruire le condizioni perché questo succeda.<br>Perché divertirvi ci interessa moltissimo, ma non ci basta.<\u002Fp>\n          <p style=\"margin:16px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:rgba(241,231,211,.8)\">Vogliamo che chi entra in una nostra esperienza abbia un mistero da scoprire, una decisione da prendere, qualcuno con cui collaborare, una storia nella quale infilarsi e delle belle emozioni da portare a casa.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"margin-top:clamp(28px,4vw,56px);border-top:1px solid rgba(241,231,211,.25);padding-top:clamp(20px,3vw,34px)\">\n        <p style=\"margin:0;font-family:'Bodoni Moda',serif;font-size:clamp(22px,2.8vw,40px);line-height:1.25;max-width:34ch\">Non vogliamo spettatori, perchè non facciamo intrattenimento.<br><em style=\"font-style:italic;color:#A97E3C\">Vogliamo complici, perché senza di voi non succede niente.<\u002Fem><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══ VERTICALI ══ -->\n  <section data-screen-label=\"Verticali\" style=\"background:#39463A;color:#F1E7D3;padding:clamp(44px,6.5vw,104px) clamp(20px,5vw,72px)\">\n    <div style=\"max-width:1440px;margin:0 auto\">\n      <div data-reveal=\"\" style=\"border-bottom:1px solid rgba(241,231,211,.3);padding-bottom:18px\">\n        <p style=\"margin:0;font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(24px,3.2vw,44px);line-height:1.2;color:#F1E7D3;max-width:26ch\">“Ehi, cosa organizziamo stavolta?”<\u002Fp>\n        <p style=\"margin:16px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.6;color:rgba(241,231,211,.8);max-width:58ch\">È più o meno da questa frase buttata lì che iniziano tutti i nostri problemi migliori.<br>Non tutti arrivano da noi cercando un format.<br>Spesso sapete soltanto perché volete giocare.<br>Al resto possiamo pensarci insieme.<\u002Fp>\n      <\u002Fdiv>\n\n      <div id=\"addii\" data-reveal=\"\" style=\"margin-top:clamp(28px,3.5vw,52px);display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:clamp(22px,3.5vw,52px);align-items:center\">\n        <div style=\"min-width:0\">\n          <div style=\"font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.22em;color:#C4B393\">TEAM DI AMICHE (E CONOSCENTI)<\u002Fdiv>\n          <h3 style=\"margin:12px 0 0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(26px,3vw,40px);line-height:1.05\">Addii al nubilato<\u002Fh3>\n          <p style=\"margin:14px 0 0;font-size:clamp(18px,1.5vw,20px);line-height:1.6;color:rgba(241,231,211,.82);max-width:50ch\">Se ti hanno affidato l'organizzazione dell'addio al nubilato significa che qualcuno si fida moltissimo di te.<br>Oppure che tutte le altre si sono tirate indietro in tempo.<br>In entrambi i casi possiamo aiutarti.<\u002Fp>\n          <p style=\"margin:14px 0 0;font-size:clamp(18px,1.5vw,20px);line-height:1.6;color:rgba(241,231,211,.82);max-width:50ch\">Niente programmi tutti uguali, niente imbarazzi obbligatori e nessuna necessità di umiliare pubblicamente la sposa per dimostrarle affetto.<br>A quello, eventualmente, pensiamo noi attraverso il gioco.<\u002Fp>\n          <a href=\"#addii\" style=\"border:0;display:inline-flex;align-items:center;margin-top:20px;background:#F1E7D3;color:#14110F;padding:15px 26px;font-family:'IM Fell English SC',serif;font-size:14px;letter-spacing:.18em;box-shadow:5px 5px 0 #14110F;min-height:48px\" style-hover=\"transform:translate(2px,2px);box-shadow:3px 3px 0 #14110F\">SCOPRI GLI ADDII LOST ROOM<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"position:relative;aspect-ratio:4/3;min-height:220px;background:#241E1A;min-width:0\">\n          <image-slot id=\"lr-h2-addii\" shape=\"rect\" fit=\"cover\" placeholder=\"Foto — gruppo in gioco, risate\"><\u002Fimage-slot>\n          <div style=\"position:absolute;inset:0;pointer-events:none;border:14px solid #39463A\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"team-building\" data-reveal=\"\" style=\"margin-top:clamp(28px,3.5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:clamp(22px,3.5vw,52px);align-items:center\">\n        <div style=\"position:relative;aspect-ratio:5/4;min-height:220px;background:#241E1A;min-width:0;order:2\">\n          <image-slot id=\"lr-h2-team\" shape=\"rect\" fit=\"cover\" placeholder=\"Foto — team building, tavolo di lavoro sotto pressione\"><\u002Fimage-slot>\n          <div style=\"position:absolute;inset:0;pointer-events:none;border:14px solid #39463A\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"min-width:0;order:1\">\n          <div style=\"font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.22em;color:#C4B393\">TEAM AZIENDALI<\u002Fdiv>\n          <h3 style=\"margin:12px 0 0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(26px,3vw,40px);line-height:1.05\">Team Building<\u002Fh3>\n          <p style=\"margin:14px 0 0;font-size:clamp(18px,1.5vw,20px);line-height:1.6;color:rgba(241,231,211,.82);max-width:50ch\">Mettere venti colleghi nella stessa stanza non crea automaticamente un team.<br>Dare loro un problema da risolvere, informazioni incomplete, poco tempo, obiettivi comuni e la necessità di parlarsi sul serio può invece produrre risultati interessanti.<\u002Fp>\n          <p style=\"margin:14px 0 0;font-size:clamp(18px,1.5vw,20px);line-height:1.6;color:rgba(241,231,211,.82);max-width:50ch\">Progettiamo esperienze ludiche per aziende e gruppi di lavoro: dal team building puro alla formazione esperienziale, fino ai giochi costruiti intorno a obiettivi specifici.<\u002Fp>\n          <p style=\"margin:14px 0 0;font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(19px,1.7vw,23px);color:#C4B393\">E sì, devono anche divertirsi.<br>Altrimenti potevate fare una riunione.<\u002Fp>\n          <a href=\"#team-building\" style=\"border:0;display:inline-flex;align-items:center;margin-top:20px;background:#F1E7D3;color:#14110F;padding:15px 26px;font-family:'IM Fell English SC',serif;font-size:14px;letter-spacing:.18em;box-shadow:5px 5px 0 #14110F;min-height:48px\" style-hover=\"transform:translate(2px,2px);box-shadow:3px 3px 0 #14110F\">SCOPRI IL TEAM BUILDING<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"eventi-privati\" data-reveal=\"\" style=\"margin-top:clamp(28px,3.5vw,56px);border-top:1px solid rgba(241,231,211,.3);padding-top:clamp(22px,3vw,36px);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(22px,3.5vw,52px);align-items:start\">\n        <div style=\"min-width:0\">\n          <div style=\"font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.22em;color:#C4B393\">FESTE DI COMPLEANNO, LAUREA O SERATE ALTERNATIVE<\u002Fdiv>\n          <h3 style=\"margin:12px 0 0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(26px,3vw,40px);line-height:1.05\">Eventi privati<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"min-width:0\">\n          <p style=\"margin:0;font-size:clamp(18px,1.5vw,20px);line-height:1.6;color:rgba(241,231,211,.82)\">Compleanni, lauree, feste, gruppi di amici e tutte quelle occasioni nelle quali:<br><em style=\"font-family:'IM Fell English',serif;font-style:italic;color:#C4B393\">“Andiamo semplicemente a cena?”<\u002Fem><br>non vi entusiasma abbastanza.<\u002Fp>\n          <p style=\"margin:14px 0 0;font-size:clamp(18px,1.5vw,20px);line-height:1.6;color:rgba(241,231,211,.82)\">Possiamo aggiungere un omicidio.<br>Finto, naturalmente.<br>Oppure un mistero, una missione, una competizione o qualcosa che ancora non abbiamo inventato.<\u002Fp>\n          <a href=\"#contatti\" style=\"border:1px solid #F1E7D3;color:#F1E7D3;display:inline-flex;align-items:center;margin-top:20px;padding:15px 26px;font-family:'IM Fell English SC',serif;font-size:14px;letter-spacing:.18em;min-height:48px\" style-hover=\"background:#F1E7D3;color:#14110F\">ORGANIZZA QUALCOSA<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══ PROGETTI ══ -->\n  <section id=\"progetti\" data-screen-label=\"Progetti\" style=\"background:#F1E7D3;color:#14110F;padding:clamp(44px,6.5vw,104px) clamp(20px,5vw,72px);background-image:repeating-linear-gradient(0deg,rgba(20,17,15,.05) 0 1px,transparent 1px 4px)\">\n    <div style=\"max-width:1440px;margin:0 auto\">\n      <div data-reveal=\"\" style=\"display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;border-bottom:2px solid #14110F;padding-bottom:14px\">\n        <h2 style=\"margin:0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(30px,4.4vw,62px);line-height:1\">Progetti<\u002Fh2>\n        <span style=\"margin-left:auto;font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.2em;color:#7B6A50\">EVENTI SPECIALI · ISTITUZIONALI · PILOTA<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:clamp(22px,3.5vw,56px);margin-top:clamp(26px,3.5vw,48px);align-items:start\">\n        <div data-reveal=\"\" style=\"min-width:0\">\n          <p style=\"margin:0;font-family:'Bodoni Moda',serif;font-size:clamp(21px,2.2vw,30px);line-height:1.35;max-width:26ch\">E poi ci sono le cose che non avevano ancora un nome.<br><em style=\"font-style:italic;color:#7B1D14\">Sono probabilmente quelle che ci piacciono di più.<\u002Fem><\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"min-width:0\">\n          <p style=\"margin:0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:#3A3128\">In questi anni abbiamo progettato esperienze dentro luoghi culturali e siti archeologici, eventi per aziende e istituzioni, giochi territoriali, produzioni immersive, attività per centinaia di partecipanti e strani esperimenti che inizialmente esistevano soltanto sotto forma di una frase:<\u002Fp>\n          <p style=\"margin:14px 0 0;font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(21px,2vw,27px);color:#7B1D14\">“E se facessimo…?”<\u002Fp>\n          <p style=\"margin:14px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:#3A3128\">Da lì, generalmente, la situazione degenera.<br>Per fortuna.<\u002Fp>\n          <p style=\"margin:14px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:#3A3128\">Ogni progetto parte da qualcosa di diverso: un luogo, una storia, un pubblico, un obiettivo, una comunità, a volte persino un problema.<br>Poi arriva il gioco.<br>Questi sono alcuni dei posti in cui ci ha portato.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(20px,2.6vw,40px);margin-top:clamp(30px,4vw,60px);align-items:start\">\n        <div data-reveal=\"\" style=\"min-width:0\">\n          <div style=\"position:relative;aspect-ratio:3/4;min-height:240px;background:#241E1A\"><image-slot id=\"lr-h2-p1\" shape=\"rect\" fit=\"cover\" placeholder=\"Foto progetto 01\"><\u002Fimage-slot>\n            <div style=\"position:absolute;left:0;top:0;background:#14110F;color:#F1E7D3;padding:7px 13px;font-family:'IM Fell English SC',serif;font-size:11px;letter-spacing:.2em\">PROGETTO 01<\u002Fdiv>\n          <\u002Fdiv>\n          <h3 style=\"margin:16px 0 0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(22px,2.4vw,30px)\">Titolo progetto<\u002Fh3>\n          <div style=\"margin:6px 0 0;font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.16em;color:#7B6A50\">CATEGORIA · LUOGO · ANNO<\u002Fdiv>\n          <p style=\"margin:10px 0 0;font-size:17px;line-height:1.6;color:#3A3128\">Breve descrizione specifica del progetto.<\u002Fp>\n          <a href=\"#progetti\" style=\"border:0;display:inline-flex;margin-top:12px;font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.18em;color:#7B1D14;border-bottom:1px solid rgba(123,29,20,.4);padding-bottom:4px\" style-hover=\"color:#14110F;border-bottom-color:#14110F\">SCOPRI IL PROGETTO<\u002Fa>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"min-width:0;margin-top:clamp(0px,3vw,48px)\">\n          <div style=\"position:relative;aspect-ratio:1;min-height:220px;background:#E4D6BC;padding:12px\">\n            <div style=\"position:absolute;inset:0;border:1px solid rgba(20,17,15,.3)\"><\u002Fdiv>\n            <div style=\"position:relative;height:100%\"><image-slot id=\"lr-h2-p2\" shape=\"rect\" fit=\"cover\" placeholder=\"Foto progetto 02\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"position:absolute;left:12px;bottom:-1px;background:#7B1D14;color:#F1E7D3;padding:6px 12px;font-family:'IM Fell English SC',serif;font-size:11px;letter-spacing:.2em\">PROGETTO 02<\u002Fdiv>\n          <\u002Fdiv>\n          <h3 style=\"margin:16px 0 0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(22px,2.4vw,30px)\">Titolo progetto<\u002Fh3>\n          <div style=\"margin:6px 0 0;font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.16em;color:#7B6A50\">CATEGORIA · LUOGO · ANNO<\u002Fdiv>\n          <p style=\"margin:10px 0 0;font-size:17px;line-height:1.6;color:#3A3128\">Breve descrizione specifica del progetto.<\u002Fp>\n          <a href=\"#progetti\" style=\"border:0;display:inline-flex;margin-top:12px;font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.18em;color:#7B1D14;border-bottom:1px solid rgba(123,29,20,.4);padding-bottom:4px\" style-hover=\"color:#14110F;border-bottom-color:#14110F\">SCOPRI IL PROGETTO<\u002Fa>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"min-width:0;margin-top:clamp(0px,5vw,84px)\">\n          <div style=\"position:relative;aspect-ratio:4/5;min-height:230px;background:#241E1A\"><image-slot id=\"lr-h2-p3\" shape=\"rect\" fit=\"cover\" placeholder=\"Foto progetto 03\"><\u002Fimage-slot>\n            <div style=\"position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 40%,transparent 34%,rgba(20,17,15,.6) 100%)\"><\u002Fdiv>\n            <div style=\"position:absolute;left:0;top:0;background:#14110F;color:#F1E7D3;padding:7px 13px;font-family:'IM Fell English SC',serif;font-size:11px;letter-spacing:.2em\">PROGETTO 03<\u002Fdiv>\n          <\u002Fdiv>\n          <h3 style=\"margin:16px 0 0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(22px,2.4vw,30px)\">Titolo progetto<\u002Fh3>\n          <div style=\"margin:6px 0 0;font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.16em;color:#7B6A50\">CATEGORIA · LUOGO · ANNO<\u002Fdiv>\n          <p style=\"margin:10px 0 0;font-size:17px;line-height:1.6;color:#3A3128\">Breve descrizione specifica del progetto.<\u002Fp>\n          <a href=\"#progetti\" style=\"border:0;display:inline-flex;margin-top:12px;font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.18em;color:#7B1D14;border-bottom:1px solid rgba(123,29,20,.4);padding-bottom:4px\" style-hover=\"color:#14110F;border-bottom-color:#14110F\">SCOPRI IL PROGETTO<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"margin-top:clamp(26px,3vw,44px)\">\n        <a href=\"#progetti\" style=\"border:1px solid #14110F;color:#14110F;display:inline-flex;align-items:center;padding:16px 28px;font-family:'IM Fell English SC',serif;font-size:14px;letter-spacing:.2em;min-height:48px\" style-hover=\"background:#14110F;color:#F1E7D3\">ESPLORA TUTTI I PROGETTI<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══ CHI C'È DIETRO ══ -->\n  <section id=\"chi-siamo\" data-screen-label=\"Chi siamo\" style=\"padding:clamp(44px,6.5vw,104px) clamp(20px,5vw,72px)\">\n    <div style=\"max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(26px,4vw,72px);align-items:start\">\n      <div data-reveal=\"\" style=\"min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px\">\n        <div style=\"position:relative;aspect-ratio:3/4;min-height:240px;background:#241E1A;align-self:end\"><image-slot id=\"lr-h2-fausta\" shape=\"rect\" fit=\"cover\" placeholder=\"Ritratto — Fausta\"><\u002Fimage-slot>\n          <div style=\"position:absolute;left:0;bottom:0;background:#14110F;color:#F1E7D3;padding:6px 11px;font-family:'IM Fell English SC',serif;font-size:11px;letter-spacing:.18em\">FAUSTA<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:relative;aspect-ratio:3/4;min-height:200px;background:#241E1A;margin-bottom:clamp(20px,4vw,56px)\"><image-slot id=\"lr-h2-filippo\" shape=\"rect\" fit=\"cover\" placeholder=\"Ritratto — Filippo\"><\u002Fimage-slot>\n          <div style=\"position:absolute;left:0;bottom:0;background:#14110F;color:#F1E7D3;padding:6px 11px;font-family:'IM Fell English SC',serif;font-size:11px;letter-spacing:.18em\">FILIPPO<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"min-width:0\">\n        <div style=\"font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.24em;color:#A97E3C\">CHI C'È DIETRO LOST ROOM<\u002Fdiv>\n        <h2 style=\"margin:14px 0 0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(28px,4vw,54px);line-height:1.02;max-width:24ch\">Qualcuno ci ha definiti “geni del male”.<\u002Fh2>\n        <p style=\"margin:16px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:rgba(241,231,211,.8);max-width:50ch\">Non abbiamo mai capito se fosse un complimento. Abbiamo deciso di sì.<\u002Fp>\n        <p style=\"margin:16px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:rgba(241,231,211,.8);max-width:50ch\">Siamo Fausta Laddomada e Filippo Manca.<br>Due millennials cresciuti con una quantità poco ragionevole di libri, giochi, film, serie TV, videogiochi e misteri.<\u002Fp>\n        <p style=\"margin:16px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:rgba(241,231,211,.8);max-width:50ch\">Ci piace ancora giocare.<br>Ci piace sentirci ancora un po' bambini.<br>Ci piacciono le mappe, le storie nelle quali qualcosa non torna, gli oggetti che sembrano provenire da un altro tempo, le torce che illuminano un dettaglio nel buio e le porte che probabilmente non dovremmo aprire.<\u002Fp>\n        <p style=\"margin:16px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:rgba(241,231,211,.8);max-width:50ch\">Siamo due persone molte curiose, al punto da essere appassionati di tecnologia innovazione ma anche profondamente innamorati di tutto quello che arriva dal passato.<br>Per questo nei nostri giochi possono convivere tecnologia e carta, QR code e vecchi documenti, meccaniche nuove e storie che sembrano essere state raccontate cento anni fa.<\u002Fp>\n        <p style=\"margin:16px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:rgba(241,231,211,.8);max-width:50ch\">Nel 2016 abbiamo aperto Lost Room come escape room a Cagliari.<br>Da allora inventiamo modi sempre nuovi di mettere le persone nei guai.<br><em style=\"font-family:'IM Fell English',serif;font-style:italic;color:#A97E3C\">Per gioco, naturalmente.<\u002Fem><\u002Fp>\n        <a href=\"#chi-siamo\" style=\"border:0;display:inline-flex;align-items:center;margin-top:24px;background:#7B1D14;color:#F1E7D3;padding:16px 28px;font-family:'IM Fell English SC',serif;font-size:14px;letter-spacing:.2em;box-shadow:5px 5px 0 #A97E3C;min-height:48px\" style-hover=\"transform:translate(2px,2px);box-shadow:3px 3px 0 #A97E3C\">CONOSCI LE BRUTTE PERSONE<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══ COSA STA SUCCEDENDO ══ -->\n  <section id=\"eventi\" data-screen-label=\"Cosa sta succedendo\" style=\"background:#F1E7D3;color:#14110F;padding:clamp(44px,6.5vw,104px) clamp(20px,5vw,72px);background-image:repeating-linear-gradient(0deg,rgba(20,17,15,.05) 0 1px,transparent 1px 4px)\">\n    <div style=\"max-width:1120px;margin:0 auto\">\n      <div data-reveal=\"\" style=\"border-bottom:2px solid #14110F;padding-bottom:14px\">\n        <div style=\"font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.24em;color:#7B1D14\">COSA STA SUCCEDENDO<\u002Fdiv>\n        <h2 style=\"margin:14px 0 0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(28px,4.2vw,58px);line-height:1\">Vuoi giocare con noi?<\u002Fh2>\n      <\u002Fdiv>\n      <p data-reveal=\"\" style=\"margin:22px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:#3A3128;max-width:62ch\">Durante l'anno organizziamo anche esperienze aperte al pubblico.<br>Le nostre date non seguono un calendario particolarmente rassicurante.<br>Dipendono dalle storie, dalle location, dalle collaborazioni e da quando riusciamo effettivamente a mettere insieme tutti i pezzi.<\u002Fp>\n\n      <sc-if value=\"{{ eventiInProgramma }}\" hint-placeholder-val=\"{{ true }}\">\n        <div data-reveal=\"\" style=\"margin-top:clamp(28px,3.5vw,48px)\">\n          <div style=\"font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.24em;color:#7B6A50;margin-bottom:16px\">PROSSIMAMENTE<\u002Fdiv>\n          <div style=\"display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-top:1px solid rgba(20,17,15,.3);border-bottom:1px solid rgba(20,17,15,.3);padding:22px 0\">\n            <div style=\"flex:0 0 200px;position:relative;aspect-ratio:4/3;min-height:130px;background:#241E1A\"><image-slot id=\"lr-h2-ev1\" shape=\"rect\" fit=\"cover\" placeholder=\"Foto evento\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"flex:1 1 240px;min-width:0\">\n              <h3 style=\"margin:0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(22px,2.4vw,32px)\">Titolo evento<\u002Fh3>\n              <div style=\"margin:6px 0 0;font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.18em;color:#7B6A50\">DATA · LOCATION<\u002Fdiv>\n              <p style=\"margin:10px 0 0;font-size:17px;line-height:1.6;color:#3A3128\">Breve teaser.<\u002Fp>\n            <\u002Fdiv>\n            <a href=\"#eventi\" style=\"border:1px solid #14110F;color:#14110F;padding:14px 24px;font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.2em;min-height:44px;display:inline-flex;align-items:center\" style-hover=\"background:#14110F;color:#F1E7D3\">SCOPRI L'EVENTO<\u002Fa>\n          <\u002Fdiv>\n          <a href=\"#eventi\" style=\"border:0;display:inline-flex;align-items:center;margin-top:22px;background:#7B1D14;color:#F1E7D3;padding:16px 28px;font-family:'IM Fell English SC',serif;font-size:14px;letter-spacing:.2em;box-shadow:5px 5px 0 #14110F;min-height:48px\" style-hover=\"transform:translate(2px,2px);box-shadow:3px 3px 0 #14110F\">VEDI TUTTI I PROSSIMI EVENTI<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ nessunEvento }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-reveal=\"\" style=\"margin-top:clamp(28px,3.5vw,48px);border:1px solid rgba(20,17,15,.35);padding:clamp(22px,3vw,36px);position:relative;background:#E4D6BC\">\n          <div style=\"position:absolute;inset:9px;border:1px solid rgba(20,17,15,.2);pointer-events:none\"><\u002Fdiv>\n          <div style=\"position:relative\">\n            <h3 style=\"margin:0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(22px,2.6vw,34px);line-height:1.1\">In questo momento non trovi niente?<\u002Fh3>\n            <p style=\"margin:12px 0 0;font-size:clamp(18px,1.5vw,20px);line-height:1.6;color:#3A3128;max-width:54ch\">Non significa che siamo morti.<br>Probabilmente stiamo preparando qualcosa.<br>Lasciaci il tuo contatto e sarai tra i primi a sapere quando succede qualcosa di sospetto.<\u002Fp>\n            <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:20px\">\n              <input type=\"email\" placeholder=\"Email\" style=\"flex:1 1 220px;min-width:0;background:transparent;border:0;border-bottom:1px solid rgba(20,17,15,.45);color:#14110F;font-family:'EB Garamond',serif;font-size:18px;padding:12px 2px;min-height:48px\">\n              <button style=\"border:0;background:#7B1D14;color:#F1E7D3;padding:15px 26px;font-family:'IM Fell English SC',serif;font-size:14px;letter-spacing:.2em;cursor:pointer;box-shadow:5px 5px 0 #14110F;min-height:48px\" style-hover=\"transform:translate(2px,2px);box-shadow:3px 3px 0 #14110F\">AVVISATEMI<\u002Fbutton>\n            <\u002Fdiv>\n            <p style=\"margin:14px 0 0;font-size:16px;color:#7B6A50\">Niente spam. Abbiamo già abbastanza cose di cui vergognarci.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══ HALLOWEEN ══ -->\n  <section id=\"halloween\" data-screen-label=\"Halloween\" style=\"position:relative;padding:clamp(44px,6.5vw,104px) clamp(20px,5vw,72px);overflow:hidden\">\n    <div style=\"position:absolute;left:50%;top:6%;width:min(20vw,220px);opacity:.09;mix-blend-mode:screen;pointer-events:none\"><img src=\"def385b7-beb7-4b2f-ba62-9776ec602fc8\" alt=\"\" style=\"width:100%;display:block;filter:invert(1)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(24px,4vw,64px);align-items:center\">\n      <div data-reveal=\"\" style=\"min-width:0\">\n        <div style=\"font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.24em;color:#A97E3C\">IL NOSTRO APPUNTAMENTO ANNUALE CON HALLOWEEN<\u002Fdiv>\n        <h2 style=\"margin:14px 0 0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(28px,4.2vw,58px);line-height:1.02;max-width:24ch\">Ci sono persone normali che aspettano Natale.<\u002Fh2>\n        <p style=\"margin:16px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:rgba(241,231,211,.8);max-width:50ch\">Noi cominciamo a pensare ad Halloween con un anticipo francamente poco salutare.<\u002Fp>\n        <p style=\"margin:14px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:rgba(241,231,211,.8);max-width:50ch\">Ogni anno costruiamo una nuova esperienza.<br>Ogni anno promettiamo a noi stessi di organizzare qualcosa di più semplice.<br><em style=\"font-family:'IM Fell English',serif;font-style:italic;color:#A97E3C\">Finora non ha funzionato.<\u002Fem><\u002Fp>\n        <a href=\"#halloween\" style=\"border:0;display:inline-flex;align-items:center;margin-top:24px;background:#7B1D14;color:#F1E7D3;padding:16px 28px;font-family:'IM Fell English SC',serif;font-size:14px;letter-spacing:.2em;box-shadow:5px 5px 0 #A97E3C;min-height:48px\" style-hover=\"transform:translate(2px,2px);box-shadow:3px 3px 0 #A97E3C\">SCOPRI HALLOWEEN CON LOST ROOM<\u002Fa>\n        <div style=\"margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.18em\">\n          <a href=\"#halloween\" style=\"border:1px solid rgba(241,231,211,.4);color:rgba(241,231,211,.75);padding:7px 13px\" style-hover=\"border-color:#A97E3C;color:#A97E3C\">2026<\u002Fa>\n          <a href=\"#halloween\" style=\"border:1px solid rgba(241,231,211,.4);color:rgba(241,231,211,.75);padding:7px 13px\" style-hover=\"border-color:#A97E3C;color:#A97E3C\">2025<\u002Fa>\n          <a href=\"#halloween\" style=\"border:1px solid rgba(241,231,211,.4);color:rgba(241,231,211,.75);padding:7px 13px\" style-hover=\"border-color:#A97E3C;color:#A97E3C\">2024<\u002Fa>\n          <a href=\"#halloween\" style=\"border:1px solid rgba(241,231,211,.4);color:rgba(241,231,211,.75);padding:7px 13px\" style-hover=\"border-color:#A97E3C;color:#A97E3C\">2023<\u002Fa>\n          <a href=\"#halloween\" style=\"border:1px solid rgba(241,231,211,.4);color:rgba(241,231,211,.75);padding:7px 13px\" style-hover=\"border-color:#A97E3C;color:#A97E3C\">2022<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"position:relative;aspect-ratio:4/5;min-height:260px;background:#241E1A;min-width:0\">\n        <image-slot id=\"lr-h2-halloween\" shape=\"rect\" fit=\"cover\" placeholder=\"Foto — edizione Halloween\"><\u002Fimage-slot>\n        <div style=\"position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 40%,transparent 30%,rgba(20,17,15,.7) 100%)\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══ CONTATTI ══ -->\n  <section id=\"contatti\" data-screen-label=\"Contatti\" style=\"background:#E4D6BC;color:#14110F;padding:clamp(44px,6.5vw,104px) clamp(20px,5vw,72px)\">\n    <div style=\"max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(26px,4vw,72px);align-items:start\">\n      <div data-reveal=\"\" style=\"min-width:0\">\n        <div style=\"width:clamp(50px,5vw,74px);margin-bottom:16px\"><img src=\"182a9ac5-4999-4cdd-ab9e-688d2151f0c2\" alt=\"\" style=\"width:100%;display:block;mix-blend-mode:multiply\"><\u002Fdiv>\n        <div style=\"font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.24em;color:#7B1D14\">CONTATTI<\u002Fdiv>\n        <h2 style=\"margin:14px 0 0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(30px,4.4vw,62px);line-height:1\">Hai qualcosa in mente?<\u002Fh2>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"min-width:0\">\n        <p style=\"margin:0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:#3A3128;max-width:52ch\">Puoi avere già un'idea molto precisa.<br>Puoi sapere soltanto che devi organizzare qualcosa per trenta persone.<br>Puoi avere un luogo, un progetto, un gruppo di colleghi o un'amica che si sposa.<br>Oppure puoi semplicemente scriverci:<\u002Fp>\n        <p style=\"margin:16px 0 0;font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(21px,2.1vw,28px);line-height:1.4;color:#7B1D14\">“Ho avuto un'idea strana.”<\u002Fp>\n        <p style=\"margin:16px 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.65;color:#3A3128;max-width:52ch\">È un ottimo modo per cominciare.<br>Raccontaci chi siete, quante persone siete e che cosa vorreste far succedere.<br>Al modo di complicarvi la vita penseremo insieme.<\u002Fp>\n        <a href=\"#contatti\" style=\"border:0;display:inline-flex;align-items:center;margin-top:24px;background:#7B1D14;color:#F1E7D3;padding:17px 30px;font-family:'IM Fell English SC',serif;font-size:15px;letter-spacing:.2em;box-shadow:5px 5px 0 #14110F;min-height:48px\" style-hover=\"transform:translate(2px,2px);box-shadow:3px 3px 0 #14110F\">PARLIAMONE<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══ FOOTER ══ -->\n  <footer style=\"border-top:1px solid rgba(241,231,211,.22);padding:clamp(30px,4vw,60px) clamp(20px,5vw,72px)\">\n    <div style=\"max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(24px,3.5vw,56px);align-items:start\">\n      <div>\n        <div style=\"width:74px;mix-blend-mode:screen\"><img src=\"ea317150-a57c-42e7-b85e-5be6d12f47b2\" alt=\"Lost Room\" style=\"width:100%;display:block\"><\u002Fdiv>\n        <div style=\"margin-top:16px;font-family:'Bodoni Moda',serif;font-size:24px\">LOST ROOM<\u002Fdiv>\n        <p style=\"margin:10px 0 0;font-size:17px;line-height:1.6;color:rgba(241,231,211,.7)\">Giochi, storie ed esperienze dal 2016.<br>Cagliari, Sardegna.<\u002Fp>\n        <p style=\"margin:12px 0 0;font-family:'IM Fell English',serif;font-style:italic;font-size:18px;line-height:1.5;color:#A97E3C\">Sembriamo buoni ma siamo cattivi. O forse era il contrario.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px;font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.16em\">\n        <a href=\"#format\" style=\"border:0;color:rgba(241,231,211,.75)\" style-hover=\"color:#A97E3C\">FORMAT<\u002Fa>\n        <a href=\"#addii\" style=\"border:0;color:rgba(241,231,211,.75)\" style-hover=\"color:#A97E3C\">ADDII AL NUBILATO<\u002Fa>\n        <a href=\"#team-building\" style=\"border:0;color:rgba(241,231,211,.75)\" style-hover=\"color:#A97E3C\">TEAM BUILDING<\u002Fa>\n        <a href=\"#eventi-privati\" style=\"border:0;color:rgba(241,231,211,.75)\" style-hover=\"color:#A97E3C\">EVENTI PRIVATI<\u002Fa>\n        <a href=\"#halloween\" style=\"border:0;color:rgba(241,231,211,.75)\" style-hover=\"color:#A97E3C\">HALLOWEEN<\u002Fa>\n        <a href=\"#progetti\" style=\"border:0;color:rgba(241,231,211,.75)\" style-hover=\"color:#A97E3C\">PROGETTI<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px;font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.16em\">\n        <a href=\"#chi-siamo\" style=\"border:0;color:rgba(241,231,211,.75)\" style-hover=\"color:#A97E3C\">CHI SIAMO<\u002Fa>\n        <a href=\"#eventi\" style=\"border:0;color:rgba(241,231,211,.75)\" style-hover=\"color:#A97E3C\">PROSSIMI EVENTI<\u002Fa>\n        <a href=\"#contatti\" style=\"border:0;color:rgba(241,231,211,.75)\" style-hover=\"color:#A97E3C\">CONTATTI<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px;font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.16em\">\n        <a href=\"#top\" style=\"border:0;color:rgba(241,231,211,.75)\" style-hover=\"color:#A97E3C\">INSTAGRAM<\u002Fa>\n        <a href=\"#top\" style=\"border:0;color:rgba(241,231,211,.75)\" style-hover=\"color:#A97E3C\">FACEBOOK<\u002Fa>\n        <a href=\"#top\" style=\"border:0;color:rgba(241,231,211,.75)\" style-hover=\"color:#A97E3C\">WHATSAPP<\u002Fa>\n        <span style=\"margin-top:12px;display:flex;gap:14px;color:rgba(241,231,211,.45)\"><a href=\"#top\" style=\"border:0;color:inherit\" style-hover=\"color:#A97E3C\">PRIVACY<\u002Fa><a href=\"#top\" style=\"border:0;color:inherit\" style-hover=\"color:#A97E3C\">COOKIE<\u002Fa><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;eventiInProgramma&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prossimi eventi&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduced) return;\n    const show = (el) => {\n      if (el.dataset.revealed) return;\n      el.dataset.revealed = '1';\n      const sibs = Array.from(el.parentElement ? el.parentElement.children : []).filter(n => n.hasAttribute && n.hasAttribute('data-reveal'));\n      el.style.transitionDelay = Math.min(Math.max(sibs.indexOf(el), 0), 4) * 110 + 'ms';\n      el.style.opacity = '1';\n      el.style.transform = 'none';\n    };\n    els.forEach(el => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(20px)';\n      el.style.transition = 'opacity 800ms ease-out, transform 800ms cubic-bezier(.2,.7,.2,1)';\n    });\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(e => { if (e.isIntersecting) { show(e.target); io.unobserve(e.target); } });\n    }, { rootMargin: '0px 0px -8% 0px', threshold: 0 });\n    els.forEach(el => io.observe(el));\n    const sweep = () => els.forEach(el => {\n      if (el.getBoundingClientRect().top < window.innerHeight) { show(el); io.unobserve(el); }\n    });\n    this._sweep = sweep;\n    window.addEventListener('scroll', sweep, { passive: true });\n    window.addEventListener('resize', sweep);\n    requestAnimationFrame(sweep);\n    this._io = io;\n  }\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n    if (this._sweep) { window.removeEventListener('scroll', this._sweep); window.removeEventListener('resize', this._sweep); }\n  }\n  renderVals() {\n    const eventi = this.props.eventiInProgramma ?? true;\n    return { eventiInProgramma: eventi, nessunEvento: !eventi };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
